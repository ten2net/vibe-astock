# Vibe AStock —— 本地网页工作台
#
#   docker compose up -d --build    # 构建并启动（首次较慢，要装依赖 + 构建前端）
#   docker compose logs -f          # 看日志
#   docker compose ps               # 看健康状态
#   docker compose down             # 停止并移除容器（数据保留在卷里）
#   docker compose down -v          # 连卷一起删（会丢全部业务数据，慎用）
#
# 业务数据落在三个命名卷，容器重建不丢。.env 里的凭据、局域网 Host 白名单与代理
# 配置通过 env_file 原样生效。

services:
  vibe-astock:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibe-astock:local
    container_name: vibe-astock
    restart: unless-stopped

    ports:
      # 与当前本机部署一致：对局域网开放。只想本机访问时改成 "127.0.0.1:8910:8910"
      - "8910:8910"

    env_file:
      - .env

    environment:
      # 业务数据重定向到 /data 并挂卷；默认路径在 home 下，容器重建会丢
      ASTOCK_AGENT_HOME: /data/agent
      ASTOCK_DATA_HOME: /data/duanxian
      VR_DATA_DIR: /data/market
      # 容器内必须监听全部网卡，只绑 127.0.0.1 的话宿主机的端口映射连不进来
      VIBE_HOST: 0.0.0.0
      # 代理：境外数据源（事件概率用 Kalshi / Polymarket）走它。
      # 刻意**不写进 .env** —— .env 会被 duanxian/fetchers.py 读进 os.environ，而
      # 测试会检查代码有没有擅自改 NO_PROXY，写了会被误判。部署参数放这里更合适。
      # 不需要代理的部署，删掉这六行即可。
      http_proxy: http://192.168.200.24:7890
      https_proxy: http://192.168.200.24:7890
      HTTP_PROXY: http://192.168.200.24:7890
      HTTPS_PROXY: http://192.168.200.24:7890
      # 国内源不走代理，否则绕远且可能失败
      no_proxy: localhost,127.0.0.1,192.168.15.131,192.168.200.24,.eastmoney.com,.qq.com,.baidu.com
      NO_PROXY: localhost,127.0.0.1,192.168.15.131,192.168.200.24,.eastmoney.com,.qq.com,.baidu.com

    volumes:
      - astock-agent:/data/agent        # Agent 会话、任务、证据账本、产品登录
      - astock-duanxian:/data/duanxian  # 复盘、版本、交易日志、原始归档
      - astock-market:/data/market      # 市场资料、盯盘缓存、研报
      # CodeBuddy 订阅接入：登录态与 CLI 本体都要持久化，否则容器重建就得重新 OAuth。
      # 容器内 OAuth 默认回调 127.0.0.1，与宿主机不互通，登录方式见 README「容器内登录 CodeBuddy」一节。
      - astock-codebuddy:/root/.codebuddy
      - astock-codebuddy-cli:/root/.local

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8910/api/astock/health', timeout=8).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Cloudflare Tunnel：把内网 http://vibe-astock:8910 发布到 https://a.luckybrother.cc
  # 走的是 outbound-only 隧道，宿主机不需要开放公网端口，也不需要证书/反代。
  # 使用本项目**独立**的 tunnel（vibe-astock），不与 a-share-heatmap / quant 共用，
  # 这样任何一个应用的隧道配置出错都不会连带影响另一个。
  # 前置条件（一次性，已完成）：
  #   1) cloudflared tunnel login                          # 生成 ~/.cloudflared/cert.pem
  #   2) cloudflared tunnel create vibe-astock             # 建独立隧道
  #   3) cloudflared tunnel route dns vibe-astock a.luckybrother.cc   # 建 CNAME
  #   4) a.luckybrother.cc 写进 .env 的 VIBE_ALLOW_HOSTS，否则本服务全部 API 返 403
  # 凭据 JSON 在宿主机 ~/.cloudflared/，勿提交仓库。
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - /root/.cloudflared/3c5b1ac7-34dd-44ce-85e8-8473d54c66c5.json:/etc/cloudflared/creds.json:ro
    network_mode: service:vibe-astock
    depends_on:
      vibe-astock:
        condition: service_healthy
    restart: unless-stopped

volumes:
  astock-agent:
  astock-duanxian:
  astock-market:
  astock-codebuddy:      # CodeBuddy 登录态
  astock-codebuddy-cli:  # CodeBuddy CLI 本体（含版本目录）
