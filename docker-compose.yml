# Vibe AStock —— 本地网页工作台
#
#   docker compose up -d --build    # 构建并启动（首次较慢，要装依赖 + 构建前端）
#   docker compose logs -f          # 看日志
#   docker compose ps               # 看健康状态
#   docker compose down             # 停止并移除容器（数据保留在卷里）
#   docker compose down -v          # 连卷一起删（会丢全部业务数据，慎用）
#
# 业务数据落在三个命名卷，容器重建不丢。.env 里的凭据、局域网 Host 白名单与代理
# 配置通过 env_file 原样生效。

services:
  vibe-astock:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibe-astock:local
    container_name: vibe-astock
    restart: unless-stopped

    ports:
      # 与当前本机部署一致：对局域网开放。只想本机访问时改成 "127.0.0.1:8910:8910"
      - "8910:8910"

    env_file:
      - .env

    environment:
      # 业务数据重定向到 /data 并挂卷；默认路径在 home 下，容器重建会丢
      ASTOCK_AGENT_HOME: /data/agent
      ASTOCK_DATA_HOME: /data/duanxian
      VR_DATA_DIR: /data/market
      # 容器内必须监听全部网卡，只绑 127.0.0.1 的话宿主机的端口映射连不进来
      VIBE_HOST: 0.0.0.0
      # 博客发布只看 /data/duanxian/reviews（源码在 /app/blog，随镜像更新；Pages 仓库克隆
      # 每次都是新的临时目录）。hugo 用镜像自带的固定版本 docker/bin/hugo。
      #   docker compose exec vibe-astock python scripts/publish_review.py --recent 3
      # 定时任务由宿主 cron 触发同一条命令（见下方 publish 一次性服务）。
      HUGO_BIN: /app/docker/bin/hugo
      # 代理：境外数据源（事件概率用 Kalshi / Polymarket）走它。
      # 刻意**不写进 .env** —— .env 会被 duanxian/fetchers.py 读进 os.environ，而
      # 测试会检查代码有没有擅自改 NO_PROXY，写了会被误判。部署参数放这里更合适。
      # 不需要代理的部署，删掉这六行即可。
      http_proxy: http://192.168.200.24:7890
      https_proxy: http://192.168.200.24:7890
      HTTP_PROXY: http://192.168.200.24:7890
      HTTPS_PROXY: http://192.168.200.24:7890
      # 国内源不走代理，否则绕远且可能失败
      no_proxy: localhost,127.0.0.1,192.168.15.131,192.168.200.24,.eastmoney.com,.qq.com,.baidu.com
      NO_PROXY: localhost,127.0.0.1,192.168.15.131,192.168.200.24,.eastmoney.com,.qq.com,.baidu.com

    volumes:
      - astock-agent:/data/agent        # Agent 会话、任务、证据账本、产品登录
      - astock-duanxian:/data/duanxian  # 复盘、版本、交易日志、原始归档
      - astock-market:/data/market      # 市场资料、盯盘缓存、研报
      # CodeBuddy 订阅接入：登录态与 CLI 本体都要持久化，否则容器重建就得重新 OAuth。
      # 容器内 OAuth 默认回调 127.0.0.1，与宿主机不互通，登录方式见 README「容器内登录 CodeBuddy」一节。
      - astock-codebuddy:/root/.codebuddy
      - astock-codebuddy-cli:/root/.local

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8910/api/astock/health', timeout=8).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 新版 v2 研究编排器（orchestrator + desktop + data-access 取数层），与旧版并存互不影响。
  # 页面 5940（远程模式，访问口令在卷里的 .local/access.token），API 8770 只听容器回环。
  # 公网切换：cloudflared/config.yml 的 ingress 改 http://127.0.0.1:5940，
  #           cloudflared 的 network_mode 改 service:vibe-astock-v2，回滚反向操作。
  vibe-astock-v2:
    build:
      context: .
      dockerfile: Dockerfile.v2
      args:
        # npm 直连 registry.npmmirror.com 在本网络会 ECONNRESET，构建期走代理
        https_proxy: http://192.168.200.24:7890
        http_proxy: http://192.168.200.24:7890
    image: vibe-astock-v2:local
    container_name: vibe-astock-v2
    restart: unless-stopped

    ports:
      # 与旧服务同款：对局域网开放。只想本机访问时改成 "127.0.0.1:5940:5940"
      - "5940:5940"

    environment:
      # 拼「发给使用者的链接」用的公网根地址（只用于拼链接，不是监听地址）
      VRA_PUBLIC_URL: https://a2.luckybrother.cc
      # 邀测版(可选):受邀者令牌表(scripts/trial.mjs 维护,主口令行为不变);
      # 到期拒绝页/错误里指路 VRA_RENEW_URL(面包多/爱发电商品页,先留空则提示联系部署者)。
      VRA_ACCESS_TOKENS_FILE: /app/.local/access.tokens.json
      VRA_RENEW_URL: ""
      # CodeBuddy 订阅大脑：远程模式下页面不能改 CLI 位置，用环境变量钉死。
      # 指向下面挂进来的 v2 专用持久化 CLI（与旧版容器的卷已分开，互不影响）。
      CODEBUDDY_BIN: /root/.local/bin/codebuddy
      # 代理：境外数据源与被重置的源走它（fetchEnv 会把代理变量透传给取数子进程）。
      # no_proxy 口径沿用旧容器实测可用的配置；若实测某源容器内直连不通，
      # 把它从 no_proxy 域名列表移除即可改走代理。
      http_proxy: http://192.168.200.24:7890
      https_proxy: http://192.168.200.24:7890
      HTTP_PROXY: http://192.168.200.24:7890
      HTTPS_PROXY: http://192.168.200.24:7890
      no_proxy: localhost,127.0.0.1,192.168.15.131,192.168.200.24,.eastmoney.com,.qq.com,.baidu.com
      NO_PROXY: localhost,127.0.0.1,192.168.15.131,192.168.200.24,.eastmoney.com,.qq.com,.baidu.com

    volumes:
      # 新版私有层：配置、运行产物、对话、台账、知识层档案、访问口令；容器重建不丢
      - astock-v2-local:/app/.local
      # CodeBuddy 订阅接入：登录态与 CLI 本体各用各的卷,**不再与旧版共用**。
      # 共用时两边同时跑 CodeBuddy 进程会并发读写同一套登录/会话文件(令牌刷新竞争、
      # 会话锁互踩 → 间歇性「登录失效/要重新接入」),一边升级 CLI 版本另一边也被迫跟着变。
      # 初始内容从旧卷整卷复制(登录态 + CLI 2.171.0),此后 v1 / v2 互不影响。
      - astock-v2-codebuddy:/root/.codebuddy        # OAuth 登录态(v2 专用)
      - astock-v2-codebuddy-cli:/root/.local        # CLI 本体（版本目录 + bin 软链，v2 专用）
      # Claude / Codex 本机 CLI 大脑的登录态家目录（~/.claude、CODEX_HOME 缺省
      # ~/.codex）。镜像里还没装这两个 CLI，先挂空卷占位，将来在容器里登录一次
      # 即持久化，不用挂卷迁移。
      - astock-v2-claude:/root/.claude
      - astock-v2-codex:/root/.codex
      

  # Cloudflare Tunnel：把内网 http://vibe-astock:8910 发布到 https://a.luckybrother.cc
  # 走的是 outbound-only 隧道，宿主机不需要开放公网端口，也不需要证书/反代。
  # 使用本项目**独立**的 tunnel（vibe-astock），不与 a-share-heatmap / quant 共用，
  # 这样任何一个应用的隧道配置出错都不会连带影响另一个。
  # 前置条件（一次性，已完成）：
  #   1) cloudflared tunnel login                          # 生成 ~/.cloudflared/cert.pem
  #   2) cloudflared tunnel create vibe-astock             # 建独立隧道
  #   3) cloudflared tunnel route dns vibe-astock a.luckybrother.cc   # 建 CNAME
  #   4) a.luckybrother.cc 写进 .env 的 VIBE_ALLOW_HOSTS，否则本服务全部 API 返 403
  # 凭据 JSON 在宿主机 ~/.cloudflared/，勿提交仓库。
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - /root/.cloudflared/3c5b1ac7-34dd-44ce-85e8-8473d54c66c5.json:/etc/cloudflared/creds.json:ro
    network_mode: service:vibe-astock
    depends_on:
      vibe-astock:
        condition: service_healthy
    restart: unless-stopped

  # 第二条 Cloudflare Tunnel：把 v2 研究编排器（5940）发布到 https://a2.luckybrother.cc
  # 与旧版隧道完全独立（独立 tunnel、独立容器、独立 network namespace），
  # a.luckybrother.cc（旧版）与 a2.luckybrother.cc（v2）可同时公网访问。
  # 前置条件（一次性，已完成）：
  #   1) cloudflared tunnel create vibe-astock-v2
  #   2) cloudflared tunnel route dns vibe-astock-v2 a2.luckybrother.cc
  # v2 远程模式有访问口令（卷里的 .local/access.token），公网入口同样受口令保护。
  cloudflared-v2:
    image: cloudflare/cloudflared:2026.9.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config-v2.yml:/etc/cloudflared/config.yml:ro
      - /root/.cloudflared/17642bd5-1db7-49b1-aa12-f45d92c5a121.json:/etc/cloudflared/creds.json:ro
    network_mode: service:vibe-astock-v2
    depends_on:
      vibe-astock-v2:
        condition: service_healthy
    restart: unless-stopped

  # 一次性发布容器：跑完就退，不常驻。由宿主 cron 每天盘后拉起：
  #   docker compose run --rm publish --recent 3
  # gh 没有登录态，凭据走 .env 里的 ASTOCK_PAGES_TOKEN（Pages 仓库写权限）。
  publish:
    image: vibe-astock:local
    profiles: ["publish"]
    env_file:
      - .env
    environment:
      ASTOCK_AGENT_HOME: /data/agent
      ASTOCK_DATA_HOME: /data/duanxian
      VR_DATA_DIR: /data/market
      HUGO_BIN: /app/docker/bin/hugo
      # GitHub Pages 仓库写权限令牌；没配就在这里由 .env 提供，配错了发布直接失败并打印原因
      ASTOCK_PAGES_TOKEN: ${ASTOCK_PAGES_TOKEN:-}
      # 不设代理：容器里走 192.168.200.24:7890 连 GitHub 会在 TLS 握手阶段被掐断
      # （gnutls_handshake failed），直连 github.com 反而通。Tushare 也是直连。
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    volumes:
      # 只读挂业务数据：发布只读复盘 JSON 与归档，不写
      - astock-duanxian:/data/duanxian:ro
      - astock-agent:/data/agent:ro
    entrypoint: ["python", "scripts/publish_review.py"]
    command: ["--recent", "3"]

volumes:
  astock-agent:
  astock-duanxian:
  astock-market:
  astock-codebuddy:      # CodeBuddy 登录态（仅旧版 v1 使用；v2 已改用 astock-v2-codebuddy）
  astock-codebuddy-cli:  # CodeBuddy CLI 本体（仅旧版 v1 使用；v2 已改用 astock-v2-codebuddy-cli）
  astock-v2-codebuddy:      # CodeBuddy 登录态（v2 专用，与 v1 分开，互不干扰）
  astock-v2-codebuddy-cli:  # CodeBuddy CLI 本体（v2 专用，版本与升级独立）
  astock-v2-local:       # 新版 v2 私有层（配置 / 运行产物 / 访问口令）
  astock-v2-claude:      # Claude CLI 登录态（备用占位）
  astock-v2-codex:       # Codex CLI 登录态（备用占位）
