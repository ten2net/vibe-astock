# Cloudflare Tunnel 配置：a2.luckybrother.cc → 本 stack 的 vibe-astock-v2 服务（5940）
# 与旧版隧道（vibe-astock → a.luckybrother.cc）相互独立，任一重启不影响另一个。
# 凭据文件由 ~/.cloudflared/ 挂载进来，勿提交到仓库。
tunnel: 17642bd5-1db7-49b1-aa12-f45d92c5a121
credentials-file: /etc/cloudflared/creds.json
# 传输协议:**http2(TCP 443)**。与旧版 config.yml 保持一致。
# 🔴 2026-11-10 实测:本机没有 IPv6 默认路由(只有 link-local / tailscale ULA),
#    cloudflared 的 QUIC(UDP 7844)会优先拨 [::]:7844 → "sendmsg: network is unreachable",
#    4 条连接全挂、隧道起不来,公网 530。IPv4 TCP 443 到 CF edge 实测是通的,
#    故固定用 http2,不再依赖 UDP/IPv6。长请求由下面的重连参数兜底。
protocol: http2
# 边缘链路抖动时快速重连:4 条连接 × 最长 15 秒退避,避免短时丢包就把请求扔给 530。
retries: 10
grace-period: 30s
ingress:
  - hostname: a2.luckybrother.cc
    service: http://127.0.0.1:5940
  # 兜底：其它 hostname 一律 404，避免误把流量转给本服务
  - service: http_status:404
