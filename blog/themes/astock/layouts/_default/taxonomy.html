{{ define "main" }}
<div class="va-sec">
  <div class="va-sec-h"><h2>{{ .Title }}</h2><span>共 {{ len .Pages }} 个</span></div>
  <div class="va-panel">
  {{ range .Pages }}<a class="va-tag" href="{{ .RelPermalink }}" style="margin:3px 4px 3px 0">{{ .Title }}（{{ len .RegularPages }}）</a>{{ end }}
  </div>
</div>
{{ end }}
