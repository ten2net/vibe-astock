# 复盘博客 · Hugo 站点配置（主题：Clean White）
baseurl = "https://ten2net.github.io"
title = "A 股每日复盘"
theme = "cleanwhite"
languageCode = "zh-cn"
hasCJKLanguage = true
preserveTaxonomyNames = true
enableRobotsTXT = true
summaryLength = 60

[pagination]
  pagerSize = 10
  path = "page"

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]
  page = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  autoHeadingID = true
  autoHeadingIDType = "github"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4

[params]
  header_image = "img/home-bg.jpg"
  image_404 = "img/home-bg.jpg"
  SEOTitle = "A 股每日复盘 | 揽宝投研"
  description = "公开数据 + 程序计算 + 模型解读：每日 A 股复盘，每个数字都可回溯到落盘依据。"
  keyword = "A股,每日复盘,涨停,连板,情绪周期,复盘报告,揽宝投研"
  slogan = "公开数据与程序计算，复盘每一个交易日"
  sidebar_about_description = "揽宝投研：A 股短线复盘与跟踪工作台。本页的复盘文章由它生成后自动发布。"
  sidebar_avatar = "img/avatar.png"
  omit_categories = false
  page_view_counter = false
  algolia_search = false
  featured_tags = true
  featured_condition_size = 1
  about_me = true
  last_posts = true
  last_posts_count = 5
  reward = false
  friends = false
  bookmarks = false
  upstreamAttribution = false
  custom_css = ["/css/astock.css"]

  [params.social]
  rss = true
  github = "https://github.com/ten2net/vibe-astock"

  [[params.additional_menus]]
  title = "复盘"
  href = "/post/"

  [[params.additional_menus]]
  title = "标签"
  href = "/tags/"

  [[params.additional_menus]]
  title = "V1 版"
  href = "https://a.luckybrother.cc/first-board"

  [[params.additional_menus]]
  title = "V2 版"
  href = "https://a2.luckybrother.cc/watch"
